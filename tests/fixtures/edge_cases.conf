# Edge cases config for testing

# Quoted values with spaces
Host quoted.example.com
    HostName "server with spaces"
    Port 443

# Unknown directive (should generate a warning)
Host unknown.example.com
    HosName 10.0.0.99
    Port 22

# Type error (should generate a diagnostic)
Host typeerror.example.com
    Port notanumber
    User admin

# Multiple patterns on one Host line
Host a.example.com b.example.com c.example.com
    User multi

# Negation pattern
Host *.example.com !evil.example.com
    User good

# Empty section
Host empty.example.com

Host *
    Port 22
    User fallback
