# Deploy Configuration Example
# Service deployment configuration for a microservices platform

Service api-gateway
    Port 8080
    Replicas 3
    Region us-east-1
    HealthCheck /health
    EnvVar APP_NAME api-gateway
    EnvVar LOG_LEVEL info

Service auth-service
    Port 8081
    Replicas 2
    Region us-east-1
    HealthCheck /auth/health
    EnvVar APP_NAME auth-service
    EnvVar LOG_LEVEL debug

Service *.worker
    Port 9090
    Replicas 5
    Region us-west-2
    HealthCheck /worker/health
    EnvVar WORKER_MODE async

Service *
    Port 8080
    Replicas 1
    Region us-east-1
    HealthCheck /health
    EnvVar LOG_LEVEL warn
