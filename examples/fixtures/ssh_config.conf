# SSH Config Example
# This demonstrates a typical ssh_config-style configuration

Host web.example.com
    HostName 10.0.1.100
    Port 2222
    User deploy
    IdentityFile ~/.ssh/id_deploy
    ForwardAgent yes

Host db.example.com
    HostName 10.0.1.200
    Port 5432
    User dbadmin
    IdentityFile ~/.ssh/id_db

Host *.staging.example.com
    HostName %h
    Port 22
    User staging
    IdentityFile ~/.ssh/id_staging

Host *.example.com !db.example.com
    User webteam
    ForwardAgent no

Host *
    Port 22
    User default
    IdentityFile ~/.ssh/id_rsa
    ForwardAgent no
    Compression yes
